<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#212f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sveiki App">
<title>Sveiki App — A/C Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="splash-inner">
    <img src="hedgehog.png" alt="" class="splash-char">
    <div class="splash-title">sveiki</div>
    <div class="splash-sub">App</div>
  </div>
</div>
<header id="topbar" hidden>
  <a class="brand" href="#/">
    <span class="brand-pill"><img src="logo.png" alt="Sveiki App"></span>
  </a>
  <nav id="nav"></nav>
  <div class="who"><button class="link" id="btnInstall" hidden title="Install app on your device">⬇ Install</button><span id="whoName"></span><button class="link" id="btnMenu">Account</button></div>
</header>
<main id="app"></main>
<div id="toast" role="status"></div>
<dialog id="modal"><form method="dialog" id="modalForm"></form></dialog>
<script src="permissions.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>

</html>
