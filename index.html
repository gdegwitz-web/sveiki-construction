<!DOCTYPE html>
<html lang="en">
<head>

<body>

          <span class="sv-main" id="brandName">sveiki</span>

          <polygon points="0,54 80,38 80,52 0,68" fill="#B2DCEB"/>

      </span>
    </span>
  </a>
  <nav id="nav"></nav>
  <div class="who"><button class="link" id="btnInstall" hidden title="Install app on your device">⬇ Install</button><span id="whoName"></span><button class="link" id="btnMenu">Account</button></div>

<main id="app"></main>
<div id="toast" role="status"></div>

<script src="permissions.js"></script>
<script src="config.js"></script>
